name: publish

# KST → UTC 변환 (KST = UTC+9)
#   08:00 KST = 23:00 UTC (전일)
#   12:30 KST = 03:30 UTC
#   22:30 KST = 13:30 UTC
# 참고: GitHub Actions 의 cron 은 지연될 수 있다(수 분~수십 분). 정시 발행이 중요하면
#       슬롯 시각을 10분 앞당겨 두고 발행 직전 대기하는 방식을 고려.
#
# 2026-08-01: 2주 수동 운영 기간(로드맵 #17) 동안은 schedule 트리거를 꺼둔다.
# 실제로 시크릿 등록 직후 스케줄이 실제 발행을 시도한 이력이 있어(노무 슬롯,
# 인스타그램 쪽 컨테이너 처리 실패로 결과적으론 미게시) 사람이 확인하기 전에
# 자동 발행되는 걸 막기 위해 명시적으로 비활성화했다. 카드 품질을 2주간 손수
# 검토한 뒤(로드맵 #18) 아래 schedule 블록 주석을 풀면 다시 자동 운영으로 전환된다.
# 그 전까지는 Actions 탭 → publish → Run workflow 로 수동 실행(원하면 dry_run 체크)한다.
on:
  # schedule:
  #   - cron: "0 23 * * *"
  #   - cron: "30 3 * * *"
  #   - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: 실행할 슬롯
        required: true
        default: morning
        type: choice
        options: [morning, noon, night]
      dry_run:
        description: 렌더까지만 (발행 안 함)
        required: false
        default: false
        type: boolean

concurrency:
  # 2026-08-12: news-watch.yml / approve-poll.yml 과 같은 그룹으로 통일 — 이
  # 워크플로도 data/snapshots, data/runs, assets/photos, data/photo_review.json
  # 을 커밋하므로 다른 워크플로와 겹치면 같은 push 경쟁 위험이 있다.
  group: kbo-bot-git-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # 스냅샷 커밋 + Release 업로드
    steps:
      - uses: actions/checkout@v4

      - name: 슬롯 결정
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "0 23 * * *")  echo "name=morning" >> $GITHUB_OUTPUT ;;
            "30 3 * * *")  echo "name=noon"    >> $GITHUB_OUTPUT ;;
            "30 13 * * *") echo "name=night"   >> $GITHUB_OUTPUT ;;
            *)             echo "name=${{ inputs.slot || 'morning' }}" >> $GITHUB_OUTPUT ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 시스템 의존성 (한글 폰트 + ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          mkdir -p ~/.fonts
          curl -sL -o /tmp/pretendard.zip \
            https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -oq /tmp/pretendard.zip -d /tmp/pretendard
          find /tmp/pretendard -name "*.otf" -exec cp {} ~/.fonts/ \;
          fc-cache -f > /dev/null

      - name: 파이썬 의존성
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 슬롯 실행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEDIA_BACKEND: github
          TZ: Asia/Seoul
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m src.pipeline ${{ steps.slot.outputs.name }} $ARGS

      - name: 산출물 업로드 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ steps.slot.outputs.name }}-${{ github.run_id }}
          path: |
            out/**
            data/runs/**
          retention-days: 7
          if-no-files-found: ignore

      - name: 스냅샷 · 사진캐시 커밋
        if: always()
        run: |
          git config user.name  "kbo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots data/runs assets/photos data/photo_review.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: ${{ steps.slot.outputs.name }} snapshot $(date +%F)"
          git push || true
