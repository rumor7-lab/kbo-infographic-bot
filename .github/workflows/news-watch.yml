name: news-watch

# 화제 뉴스 감지 → 텔레그램 알림(+ AI 초안)까지. scripts/news_watch.py 를 로컬 PC
# 대신 GitHub Actions 에서 주기적으로 돌린다 — PC 를 계속 켜두지 않아도 되게 하려는
# 목적. 이 워크플로가 만드는 건 텔레그램 '알림'까지다(사진 답장을 기다리는 상태로
# 주제를 저장). 실제 카드 렌더/승인/발행은 approve-poll.yml 이 사진 답장을 받은
# 뒤에 처리한다(렌더에 Playwright 가 필요해서 일부러 여기엔 안 둠 — 이 워크플로는
# 가볍게 유지).
#
# 네이버 검색 API 는 하루 25,000회 무료라 30분 간격(하루 48회 × 검색어 12개 =
# 576회)으로도 여유롭다. 다만 GitHub Actions 스케줄 크론은 실측상 정확히
# 지켜지지 않고 밀리는 경우가 흔하다(approve-poll.yml 참고) — "30분마다"는
# 목표치이지 보장은 아니다. 급하면 Actions 탭에서 수동으로 "Run workflow".
#
# 상태는 data/news_seen.json(중복 알림 방지) + data/topics/*.json(사진 답장
# 매칭용)로 git 커밋해서 다음 실행이 이어받는다 — 다른 워크플로들과 같은 패턴.
# data/topics 커밋/푸시는 news_watch.py 내부(_git_commit_push_topics)가 새 알림을
# 보냈을 때만 직접 처리하므로, git 사용자 설정을 그 실행 전에 미리 해둔다.
#
# 2026-08-12: concurrency 그룹을 approve-poll.yml 과 동일하게(kbo-bot-git-state)
# 맞췄다. 원래는 서로 다른 그룹(news-watch / approve-poll)이라 두 워크플로가
# 동시에 돌 수 있었는데, 둘 다 data/topics/ 를 커밋하다 보니 approve-poll 쪽
# 커밋이 push 시점에 non-fast-forward 로 밀려 rebase 까지 실패하면 최종 `|| true`
# 로 조용히 버려지는 경로가 있었다 — 승인 버튼을 눌러도 카드 상태가 실제로는
# 저장 안 되고 유실되는 사고의 유력한 원인. 같은 그룹으로 묶어 두 워크플로가
# 항상 순차 실행되게 하면(둘 다 cancel-in-progress: false 라 대기열에 쌓임) 이
# 경쟁 자체가 없어진다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: kbo-bot-git-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 파이썬 의존성
        run: pip install -r requirements.txt

      - name: git 사용자 설정
        run: |
          git config user.name  "kbo-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: 뉴스 감지 + 텔레그램 알림
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Seoul
        run: python scripts/news_watch.py --once --debug

      - name: 남은 상태 커밋 (news_seen.json — topics 는 위 단계에서 이미 처리됨)
        if: always()
        run: |
          git add data/news_seen.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "chore: 뉴스 감지 상태 갱신 $(date -u +%FT%TZ)"
            git push || (git pull --rebase --autostash && git push) || true
          }
