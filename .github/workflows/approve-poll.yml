name: approve-poll

# 텔레그램에서 승인/거부 버튼을 눌렀는지, 뉴스카드용 사진 답장이 왔는지를 확인한다.
# 상시 서버 없이 크론 폴링만으로 처리 — 상태(offset, 배치 파일, 주제 파일)는 매
# 실행마다 git commit 으로 저장소에 남겨서 다음 실행이 이어받는다.
#
# 배치의 모든 카드가 승인/거부로 결정되면 이 워크플로가 실제 인스타그램 발행까지
# 수행한다(승인된 카드만 묶어서 캐러셀/단일/릴스로).
#
# 사진 답장 처리(뉴스카드 렌더)도 여기서 같이 한다 — 별도 스크립트가 따로
# getUpdates 를 폴링하면 텔레그램 offset 이 봇 전체 기준 전역이라 서로 업데이트를
# 가로채는 경쟁이 생긴다(실측으로 확인). 렌더에 Playwright 가 필요해서
# notify.yml 과 같은 의존성 설치 단계가 추가됐다.
#
# 스케줄 이력:
#   "*/5 * * * *" → 실측 결과 5분 간격이 전혀 지켜지지 않고 2~3시간씩 밀리는
#     경우가 흔했다(인프라 쪽 신뢰성 문제, 우리 코드 문제 아님 — 확인됨).
#   하루 3번(조간/정오/야간 +10분) → notify.yml 과 맞췄지만, 사진 답장은 그
#     사이 시간에 오면 다음 정해진 시각까지 몇 시간이고 그냥 기다리는 문제가
#     실사용에서 반복 확인됨(사진 보내도 한참 무반응 → 수동 실행해야만 처리).
#     승인 카드는 하루 3번이면 충분하지만, 사진 답장은 사람이 방금 보낸 걸
#     빨리 확인받고 싶어하므로 더 잦은 주기가 필요.
#   → news-watch.yml 과 같은 30분 간격으로 재조정. GitHub Actions cron 이
#     정확히 지켜지진 않지만(수 분~수십 분 밀림), 하루 3번보다는 훨씬 촘촘하다.
#     더 빨리 처리하고 싶으면 Actions 탭에서 수동으로 "Run workflow".
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: approve-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 시스템 의존성 (한글 폰트 + ffmpeg, 뉴스카드 렌더용)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          mkdir -p ~/.fonts
          curl -sL -o /tmp/pretendard.zip \
            https://github.com/orioncactus/pretendard/releases/download/v1.3.9/Pretendard-1.3.9.zip
          unzip -oq /tmp/pretendard.zip -d /tmp/pretendard
          find /tmp/pretendard -name "*.otf" -exec cp {} ~/.fonts/ \;
          fc-cache -f > /dev/null

      - name: 파이썬 의존성
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 텔레그램 콜백/사진답장 확인 + 뉴스카드 렌더 + 승인된 카드 발행
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MEDIA_BACKEND: github
          TZ: Asia/Seoul
        run: python scripts/poll_telegram_approvals.py

      - name: 상태 커밋
        if: always()
        run: |
          git config user.name  "kbo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/pending data/topics data/telegram_offset.json 2>/dev/null || true
          git diff --cached --quiet || {
            git commit -m "chore: 텔레그램 승인 상태 갱신 $(date -u +%FT%TZ)"
            git push || (git pull --rebase --autostash && git push) || true
          }
